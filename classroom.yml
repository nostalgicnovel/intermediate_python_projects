name: Autograding Tests
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: TestWeatherStationInit
        id: testweatherstationinit
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestWeatherStationInit
          setup-command: ""
          command: pytest test_weather_station.py::TestWeatherStationInit -v
          timeout: 10
          max-score: 10

      - name: TestEncapsulation
        id: testencapsulation
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestEncapsulation
          setup-command: ""
          command: pytest test_weather_station.py::TestEncapsulation -v
          timeout: 10
          max-score: 10

      - name: TestDunderMethods
        id: testdundermethods
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestDunderMethods
          setup-command: ""
          command: pytest test_weather_station.py::TestDunderMethods -v
          timeout: 10
          max-score: 10

      - name: TestOperatorOverloading
        id: testoperatoroverloading
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestOperatorOverloading
          setup-command: ""
          command: pytest test_weather_station.py::TestOperatorOverloading -v
          timeout: 10
          max-score: 10

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          TESTWEATHERSTATIONINIT_RESULTS: "${{steps.testweatherstationinit.outputs.result}}"
          TESTENCAPSULATION_RESULTS: "${{steps.testencapsulation.outputs.result}}"
          TESTDUNDERMETHODS_RESULTS: "${{steps.testdundermethods.outputs.result}}"
          TESTOPERATOROVERLOADING_RESULTS: "${{steps.testoperatoroverloading.outputs.result}}"
        with:
          runners: testweatherstationinit,testencapsulation,testdundermethods,testoperatoroverloading
