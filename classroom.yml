name: Autograding Tests
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: TestAppendCheckoutRecord
        id: testappendcheckoutrecord
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestAppendCheckoutRecord
          setup-command: ""
          command: pytest test_library_records.py::TestAppendCheckoutRecord -v
          timeout: 10
          max-score: 10

      - name: TestLoadCheckoutCounts
        id: testloadcheckoutcounts
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestLoadCheckoutCounts
          setup-command: ""
          command: pytest test_library_records.py::TestLoadCheckoutCounts -v
          timeout: 10
          max-score: 10

      - name: TestCloseOutSession
        id: testcloseoutsession
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestCloseOutSession
          setup-command: ""
          command: pytest test_library_records.py::TestCloseOutSession -v
          timeout: 10
          max-score: 10

      - name: TestExportCatalogToCsv
        id: testexportcatalogtocsv
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestExportCatalogToCsv
          setup-command: ""
          command: pytest test_library_records.py::TestExportCatalogToCsv -v
          timeout: 10
          max-score: 10

      - name: TestImportAvailableTitles
        id: testimportavailabletitles
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestImportAvailableTitles
          setup-command: ""
          command: pytest test_library_records.py::TestImportAvailableTitles -v
          timeout: 10
          max-score: 10

      - name: TestUpdateLibrarySettings
        id: testupdatelibrarysettings
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestUpdateLibrarySettings
          setup-command: ""
          command: pytest test_library_records.py::TestUpdateLibrarySettings -v
          timeout: 10
          max-score: 10

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          TESTAPPENDCHECKOUTRECORD_RESULTS: "${{steps.testappendcheckoutrecord.outputs.result}}"
          TESTLOADCHECKOUTCOUNTS_RESULTS: "${{steps.testloadcheckoutcounts.outputs.result}}"
          TESTCLOSEOUTSESSION_RESULTS: "${{steps.testcloseoutsession.outputs.result}}"
          TESTEXPORTCATALOGTOCSV_RESULTS: "${{steps.testexportcatalogtocsv.outputs.result}}"
          TESTIMPORTAVAILABLETITLES_RESULTS: "${{steps.testimportavailabletitles.outputs.result}}"
          TESTUPDATELIBRARYSETTINGS_RESULTS: "${{steps.testupdatelibrarysettings.outputs.result}}"
        with:
          runners: testappendcheckoutrecord,testloadcheckoutcounts,testcloseoutsession,testexportcatalogtocsv,testimportavailabletitles,testupdatelibrarysettings
