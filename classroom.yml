name: Autograding Tests
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tkinter and a virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: TestPureFunctions
        id: testpurefunctions
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestPureFunctions
          setup-command: ""
          command: xvfb-run -a pytest test_ticket_desk.py::TestPureFunctions -v
          timeout: 20
          max-score: 10

      - name: TestWindowLayout
        id: testwindowlayout
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestWindowLayout
          setup-command: ""
          command: xvfb-run -a pytest test_ticket_desk.py::TestWindowLayout -v
          timeout: 20
          max-score: 10

      - name: TestEventHandlers
        id: testeventhandlers
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestEventHandlers
          setup-command: ""
          command: xvfb-run -a pytest test_ticket_desk.py::TestEventHandlers -v
          timeout: 20
          max-score: 15

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          TESTPUREFUNCTIONS_RESULTS: "${{steps.testpurefunctions.outputs.result}}"
          TESTWINDOWLAYOUT_RESULTS: "${{steps.testwindowlayout.outputs.result}}"
          TESTEVENTHANDLERS_RESULTS: "${{steps.testeventhandlers.outputs.result}}"
        with:
          runners: testpurefunctions,testwindowlayout,testeventhandlers
