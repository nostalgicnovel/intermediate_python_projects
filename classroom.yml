name: Autograding Tests
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: TestFirstClassFunctions
        id: testfirstclassfunctions
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestFirstClassFunctions
          setup-command: ""
          command: pytest test_expense_reports.py::TestFirstClassFunctions -v
          timeout: 10
          max-score: 10

      - name: TestMapAndFilter
        id: testmapandfilter
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestMapAndFilter
          setup-command: ""
          command: pytest test_expense_reports.py::TestMapAndFilter -v
          timeout: 10
          max-score: 10

      - name: TestReduce
        id: testreduce
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestReduce
          setup-command: ""
          command: pytest test_expense_reports.py::TestReduce -v
          timeout: 10
          max-score: 10

      - name: TestAnyAllAndPipelines
        id: testanyallandpipelines
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestAnyAllAndPipelines
          setup-command: ""
          command: pytest test_expense_reports.py::TestAnyAllAndPipelines -v
          timeout: 10
          max-score: 10

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          TESTFIRSTCLASSFUNCTIONS_RESULTS: "${{steps.testfirstclassfunctions.outputs.result}}"
          TESTMAPANDFILTER_RESULTS: "${{steps.testmapandfilter.outputs.result}}"
          TESTREDUCE_RESULTS: "${{steps.testreduce.outputs.result}}"
          TESTANYALLANDPIPELINES_RESULTS: "${{steps.testanyallandpipelines.outputs.result}}"
        with:
          runners: testfirstclassfunctions,testmapandfilter,testreduce,testanyallandpipelines
