name: Autograding Tests
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: TestCollectionRecord
        id: testcollectionrecord
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestCollectionRecord
          setup-command: ""
          command: pytest test_museum_catalog.py::TestCollectionRecord -v
          timeout: 10
          max-score: 10

      - name: TestConcreteRecords
        id: testconcreterecords
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestConcreteRecords
          setup-command: ""
          command: pytest test_museum_catalog.py::TestConcreteRecords -v
          timeout: 10
          max-score: 10

      - name: TestPolymorphismAndProtocol
        id: testpolymorphismandprotocol
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestPolymorphismAndProtocol
          setup-command: ""
          command: pytest test_museum_catalog.py::TestPolymorphismAndProtocol -v
          timeout: 10
          max-score: 10

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          TESTCOLLECTIONRECORD_RESULTS: "${{steps.testcollectionrecord.outputs.result}}"
          TESTCONCRETERECORDS_RESULTS: "${{steps.testconcreterecords.outputs.result}}"
          TESTPOLYMORPHISMANDPROTOCOL_RESULTS: "${{steps.testpolymorphismandprotocol.outputs.result}}"
        with:
          runners: testcollectionrecord,testconcreterecords,testpolymorphismandprotocol
