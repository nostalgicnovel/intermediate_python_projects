name: Autograding Tests
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: TestTallyScannedItems
        id: testtallyscanneditems
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestTallyScannedItems
          setup-command: ""
          command: pytest test_inventory_management.py::TestTallyScannedItems -v
          timeout: 10
          max-score: 10

      - name: TestMergeDepartmentBudgets
        id: testmergedepartmentbudgets
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestMergeDepartmentBudgets
          setup-command: ""
          command: pytest test_inventory_management.py::TestMergeDepartmentBudgets -v
          timeout: 10
          max-score: 10

      - name: TestFilterLowStock
        id: testfilterlowstock
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestFilterLowStock
          setup-command: ""
          command: pytest test_inventory_management.py::TestFilterLowStock -v
          timeout: 10
          max-score: 10

      - name: TestConvertMetersToFeet
        id: testconvertmeterstofeet
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestConvertMetersToFeet
          setup-command: ""
          command: pytest test_inventory_management.py::TestConvertMetersToFeet -v
          timeout: 10
          max-score: 10

      - name: TestLabelBatchSizes
        id: testlabelbatchsizes
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestLabelBatchSizes
          setup-command: ""
          command: pytest test_inventory_management.py::TestLabelBatchSizes -v
          timeout: 10
          max-score: 10

      - name: TestExtractUniqueEmailDomains
        id: testextractuniqueemaildomains
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestExtractUniqueEmailDomains
          setup-command: ""
          command: pytest test_inventory_management.py::TestExtractUniqueEmailDomains -v
          timeout: 10
          max-score: 10

      - name: TestBucketAgesByGroup
        id: testbucketagesbygroup
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestBucketAgesByGroup
          setup-command: ""
          command: pytest test_inventory_management.py::TestBucketAgesByGroup -v
          timeout: 10
          max-score: 10

      - name: TestEmployeeRecord
        id: testemployeerecord
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestEmployeeRecord
          setup-command: ""
          command: pytest test_inventory_management.py::TestEmployeeRecord -v
          timeout: 10
          max-score: 10

      - name: TestCalculateGrossPay
        id: testcalculategrosspay
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: TestCalculateGrossPay
          setup-command: ""
          command: pytest test_inventory_management.py::TestCalculateGrossPay -v
          timeout: 10
          max-score: 10

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          TESTTALLYSCANNEDITEMS_RESULTS: "${{steps.testtallyscanneditems.outputs.result}}"
          TESTMERGEDEPARTMENTBUDGETS_RESULTS: "${{steps.testmergedepartmentbudgets.outputs.result}}"
          TESTFILTERLOWSTOCK_RESULTS: "${{steps.testfilterlowstock.outputs.result}}"
          TESTCONVERTMETERSTOFEET_RESULTS: "${{steps.testconvertmeterstofeet.outputs.result}}"
          TESTLABELBATCHSIZES_RESULTS: "${{steps.testlabelbatchsizes.outputs.result}}"
          TESTEXTRACTUNIQUEEMAILDOMAINS_RESULTS: "${{steps.testextractuniqueemaildomains.outputs.result}}"
          TESTBUCKETAGESBYGROUP_RESULTS: "${{steps.testbucketagesbygroup.outputs.result}}"
          TESTEMPLOYEERECORD_RESULTS: "${{steps.testemployeerecord.outputs.result}}"
          TESTCALCULATEGROSSPAY_RESULTS: "${{steps.testcalculategrosspay.outputs.result}}"
        with:
          runners: testtallyscanneditems,testmergedepartmentbudgets,testfilterlowstock,testconvertmeterstofeet,testlabelbatchsizes,testextractuniqueemaildomains,testbucketagesbygroup,testemployeerecord,testcalculategrosspay
